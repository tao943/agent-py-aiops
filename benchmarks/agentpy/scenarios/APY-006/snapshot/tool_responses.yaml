tools:
  - name: InspectContainer
    description: Inspect one benchmark container without changing it.
    input_schema:
      type: object
      required: [service]
      additionalProperties: false
      properties:
        service:
          type: string
    calls:
      - arguments:
          service: checkout-service
        evidence_id: container-healthy-listening-8080
        result:
          service: checkout-service
          status: running
          exitCode: null
          health: healthy
          configuredPorts: [8080]
          listeningPorts: [8080]
  - name: InspectNginx
    description: Inspect the frozen Nginx route and recent upstream error.
    input_schema:
      type: object
      required: [route]
      additionalProperties: false
      properties:
        route:
          type: string
    calls:
      - arguments:
          route: checkout
        evidence_id: nginx-targets-8081
        result:
          route: checkout
          upstreamHost: checkout-service
          upstreamPort: 8081
          resolvedAddresses: [172.30.0.12]
          responseStatus: 502
          error: connect() failed (111 Connection refused) while connecting to upstream
