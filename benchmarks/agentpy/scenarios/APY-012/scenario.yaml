id: APY-012
title: Application requests to Redis are failing.
symptom_family: redis_request_failure
difficulty: medium
modes: [snapshot]
alert:
  alertname: RedisRequestFailureHigh
  service: checkout-service
  severity: critical
  summary: Application requests to Redis are failing.
hypotheses:
  - id: redis_server_availability
    description: The Redis server is not accepting client connections.
    decision_label:
      component: redis
      mechanism: service_process_stopped
  - id: redis_client_connection_lifecycle
    description: The application client pool cannot recover usable connections.
    decision_label:
      component: checkout-service
      mechanism: stale_connections_retained_after_recovery
  - id: redis_network_path
    description: The network path between the application and Redis is failing.
    decision_label:
      component: network
      mechanism: redis_network_path_failure
snapshot_file: snapshot/tool_responses.yaml
