tools:
  - name: InspectPostgres
    description: Inspect frozen PostgreSQL sessions and lock waits without changing them.
    input_schema:
      type: object
      required: [database]
      additionalProperties: false
      properties:
        database: {type: string}
    calls:
      - arguments: {database: agent_py}
        evidence_id: postgres-no-long-work-or-locks
        result:
          activeConnections: 19
          idleConnections: 1
          oldestTransactionSeconds: 4
          blockedSessions: 0
          dominantWaitEvent: null
          slowQueryCount: 0
  - name: InspectDatabasePool
    description: Inspect the frozen application connection-pool state.
    input_schema:
      type: object
      required: [service]
      additionalProperties: false
      properties:
        service: {type: string}
    calls:
      - arguments: {service: checkout-service}
        evidence_id: pool-borrow-return-divergence
        result:
          poolSize: 20
          checkedOut: 20
          waitingRequests: 31
          checkoutTotal: 9130
          checkinTotal: 9047
          retainedByApplication: 20
          retainingPath: checkout-discount-exception
  - name: GetServiceMetrics
    description: Read frozen bounded service traffic and database-pool metrics.
    input_schema:
      type: object
      required: [service, windowMinutes]
      additionalProperties: false
      properties:
        service: {type: string}
        windowMinutes: {type: integer}
    calls:
      - arguments: {service: checkout-service, windowMinutes: 15}
        evidence_id: database-connections-near-limit
        result:
          requestRateChangePercent: 2
          databaseConnectionsPercentOfLimit: 95
          poolAcquireTimeouts: 31
  - name: GetDeploymentChanges
    description: Read frozen deployment changes for one service.
    input_schema:
      type: object
      required: [service, windowMinutes]
      additionalProperties: false
      properties:
        service: {type: string}
        windowMinutes: {type: integer}
    calls:
      - arguments: {service: checkout-service, windowMinutes: 60}
        evidence_id: checkout-error-handling-release
        result:
          changes:
            - component: checkout-service
              kind: application-release
              summary: discount error handling changed
