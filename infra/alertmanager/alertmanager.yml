global:
  resolve_timeout: 5m

route:
  receiver: agent-py-webhook
  group_by: [alertname, service, environment, scenario_id, run_id]

receivers:
  - name: agent-py-webhook
    webhook_configs:
      - url: http://nginx/aiops/alerts/webhook/alertmanager/local-alertmanager
        send_resolved: true
        max_alerts: 50
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert_webhook_token
