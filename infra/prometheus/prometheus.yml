global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules/live-eval-order-pool.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: live-eval-order-api
    static_configs:
      - targets: [live-eval-order-api:8082]
