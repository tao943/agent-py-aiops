log_format live_eval escape=json
  '{"status":$status,"request_time":$request_time,'
  '"upstream_connect_time":"$upstream_connect_time",'
  '"upstream_response_time":"$upstream_response_time"}';

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/access.log live_eval;

  location = /health {
    access_log off;
    return 200 "ok\n";
  }

  location /slow {
    proxy_pass http://live-eval-upstream:8080;
    proxy_connect_timeout 500ms;
    proxy_read_timeout 750ms;
    proxy_send_timeout 750ms;
  }
}
